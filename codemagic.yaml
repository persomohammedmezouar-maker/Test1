workflows:
  android-only:
    name: Build APK Android only
    environment:
      flutter: stable

    scripts:
      - script: |
          echo "=== MARQUEUR 1 : avant flutter clean ==="
          flutter clean
          echo "=== MARQUEUR 2 : après flutter clean ==="
          flutter pub get
          echo "=== MARQUEUR 3 : après pub get ==="

          echo "=== MARQUEUR 4 : vérifier fichiers XML ==="
          ls -la android/app/src/main/
          ls -la android/app/src/main/res/xml/
          ls -la android/app/src/main/res/values/

          echo "=== MARQUEUR 5 : build APK release ==="
          flutter build apk --release --target-platform android-arm,android-arm64,android-x64 | tee flutter_build.log
          echo "=== MARQUEUR 6 : après flutter build apk ==="

          echo "=== MARQUEUR 7 : vérifier permissions GPS dans APK ==="
          unzip -p build/app/outputs/flutter-apk/*.apk AndroidManifest.xml | strings | grep -i "ACCESS_FINE\|ACCESS_COARSE" || echo "❌ PAS DE GPS !"

          echo "=== MARQUEUR 8 : lister les fichiers APK ==="
          ls -la build/app/outputs/flutter-apk/

    artifacts:
      - flutter_build.log
      - build/app/outputs/flutter-apk/*.apk