scripts:
  # ... ton code existant jusqu'au network config ...
  # Debug avant build
  - echo "=== DEBUG MANIFEST ==="
  - cat android/app/src/main/AndroidManifest.xml
  - ls -la android/app/src/main/res/values/ || mkdir -p android/app/src/main/res/values
  - |
    cat << EOF > android/app/src/main/res/values/styles.xml
    <?xml version="1.0" encoding="utf-8"?>
    <resources>
        <style name="LaunchTheme" parent="@android:style/Theme.Light.NoTitleBar">
            <item name="android:windowBackground">@android:color/white</item>
        </style>
        <style name="NormalTheme" parent="@android:style/Theme.Light.NoTitleBar">
            <item name="android:windowBackground">?android:attr/colorBackground</item>
        </style>
    </resources>
    EOF
  # Fix applicationName
  - sed -i '' 's|\${applicationName}|io.flutter.app.FlutterApplication|g' android/app/src/main/AndroidManifest.xml
  # Build APK release EXPLICITE
  - flutter build apk --release --no-shrink
  # Debug APK
  - echo "=== PERMISSIONS DANS APK FINALE ==="
  - unzip -p build/app/outputs/flutter-apk/app-release.apk AndroidManifest.xml | strings | grep -i "ACCESS_FINE\|ACCESS_COARSE" || echo "❌ PAS DE GPS !"
